<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Microsoft Rewards Script v5">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0c"/>
      <stop offset="55%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <circle cx="1120" cy="60" r="180" fill="#ffffff" opacity="0.03"/>
  <circle cx="120" cy="270" r="140" fill="#ffffff" opacity="0.025"/>

  <text x="80" y="112" fill="#ffffff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="17" letter-spacing="6" opacity="0.55">MICROSOFT REWARDS</text>

  <text x="78" y="176" fill="#ffffff" font-family="Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1">Rewards Script</text>

  <text x="80" y="212" fill="#ffffff" font-family="Inter,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="19" opacity="0.72">v5 · Node 24 · Docker · Control API · 中文面板 · CN 补丁镜像</text>

  <rect x="80" y="240" width="320" height="1.5" fill="url(#line)"/>

  <g fill="#ffffff" opacity="0.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13">
    <text x="80" y="272">daily set · search · punchcard</text>
    <text x="420" y="272">sessions · multi-account</text>
    <text x="760" y="272">panel · release pipeline</text>
  </g>

  <g transform="translate(1120,150)" opacity="0.85">
    <rect x="-46" y="-46" width="92" height="92" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
    <path d="M-22 8 L-6 -22 L10 8 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="18" cy="-14" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
