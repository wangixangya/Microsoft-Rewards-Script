# Microsoft Rewards v5 —— 应用容器 + 控制面板（分体部署，推荐）
#
# 用法：
#   1. 同目录准备 .env（账号，参考仓库 panel/env.example），并在 shell 里 export API_TOKEN / PANEL_PASSWORD
#   2. docker compose -f docker-compose.yml up -d
#   3. 打开 http://<NAS-IP>:5310 （默认密码 admin）
#
# 说明：
#   - rewards 只把 3010 暴露给本机，公网访问不到；面板通过 compose 内网调用它
#   - 面板数据（panel.conf / state.json / 历史统计）落在 panel-data 卷里，重建容器不丢
#   - 需要「面板里能重建/重启容器」的话，给 panel 追加：
#       - /var/run/docker.sock:/var/run/docker.sock
#     并把 API_BASE 换成宿主地址（容器名解析不到宿主 docker）

services:
  rewards:
    image: docker.io/wangxiangya/ms-rewards-v5:5-cn
    container_name: ms-rewards-api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
    ports:
      - "127.0.0.1:3010:3010"
    volumes:
      - ./config:/usr/src/microsoft-rewards-script/config
      - ./sessions:/usr/src/microsoft-rewards-script/sessions

  panel:
    image: docker.io/wangxiangya/ms-rewards-v5-panel:latest
    container_name: ms-rewards-panel
    restart: unless-stopped
    depends_on:
      - rewards
    environment:
      TZ: Asia/Shanghai
      PANEL_PORT: "5310"
      API_BASE: http://rewards:3010
      API_TOKEN: ${API_TOKEN:?请先 export API_TOKEN（与 .env 里的一致）}
      PANEL_PASSWORD: ${PANEL_PASSWORD:-admin}
    ports:
      - "5310:5310"
    volumes:
      - panel-data:/opt/data
      - ./config:/root/microsoft-rewards-script/config:ro
      - ./sessions:/root/microsoft-rewards-script/sessions:ro

volumes:
  panel-data:
