name: CN Patched Image

# 在 v5 源码上打「cn.bing.com 兼容」补丁，构建后**瘦身拍扁**再推送：
#   ghcr.io/<repo>:5-cn 与 :<version>-cn   （单层，约 763 MB；完整版 1.34 GB）
#
# 瘦身两步走，顺序不能反（第二步才是真正减体积的那步）：
#   1) .github/docker/Dockerfile.slim  删除 chromium-1248 / ffmpeg / npm / 文档字体等
#   2) .github/scripts/flatten-image.sh export|import 拍扁成单层，否则删除只是白洞、体积不降

on:
    push:
        branches: [v5]
        paths:
            - 'src/**'
            - 'package.json'
            - 'package-lock.json'
            - 'Dockerfile'
            - '.github/scripts/**'
            - '.github/docker/**'
            - '.github/workflows/cn-image.yml'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: cn-image-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
    build:
        name: Build CN-patched slim image
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Resolve lowercase image name
              run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Read version
              id: ver
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Apply cn.bing.com compatibility patch
              run: |
                  node .github/scripts/patch-bing-origin.js
                  grep -q 'export function isBingHost' src/constants/urls.ts
                  echo "补丁已应用（isBingHost 就位）"

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build full image (patched)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  load: true
                  platforms: linux/amd64
                  tags: local/msr:cn-build
                  cache-from: type=gha,version=2,scope=cn-image
                  cache-to: type=gha,version=2,scope=cn-image,mode=max

            - name: Strip runtime-unused files
              run: |
                  docker build \
                    --build-arg BASE_IMAGE=local/msr:cn-build \
                    --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                    --label "org.opencontainers.image.version=${{ steps.ver.outputs.version }}-cn" \
                    --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
                    --label "com.wangixangya.patch=bing-origin-cn" \
                    -f .github/docker/Dockerfile.slim \
                    -t local/msr:cn-slim .
                  echo "瘦身层: $(docker image inspect local/msr:cn-slim --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')（未拍扁，仍含白洞）"

            - name: Flatten to a single layer
              run: |
                  chmod +x .github/scripts/flatten-image.sh
                  .github/scripts/flatten-image.sh local/msr:cn-slim \
                    "$IMAGE:5-cn" "$IMAGE:${{ steps.ver.outputs.version }}-cn"

            - name: Push slim image
              run: docker push --all-tags "$IMAGE"

            - name: Login to Docker Hub
              if: env.DOCKERHUB_TOKEN != ''
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Mirror to Docker Hub (免登录分发)
              if: env.DOCKERHUB_TOKEN != ''
              run: |
                  set -e
                  DH="docker.io/${DOCKERHUB_USERNAME}/ms-rewards-v5"
                  docker tag "$IMAGE:5-cn" "$DH:5-cn"
                  docker tag "$IMAGE:5-cn" "$DH:latest"
                  docker tag "$IMAGE:${{ steps.ver.outputs.version }}-cn" "$DH:${{ steps.ver.outputs.version }}-cn"
                  docker push "$DH:5-cn"
                  docker push "$DH:latest"
                  docker push "$DH:${{ steps.ver.outputs.version }}-cn"
                  echo "Docker Hub 已同步: ${DH}:5-cn / latest / ${{ steps.ver.outputs.version }}-cn"

            - name: Report
              run: |
                  SIZE=$(docker image inspect "$IMAGE:5-cn" --format '{{.Size}}')
                  MB=$(awk -v s="$SIZE" 'BEGIN{printf "%.0f", s/1024/1024}')
                  echo "最终镜像: ${MB} MB（单层拍扁）"
                  {
                    echo "### 📦 CN 瘦身镜像已发布"
                    echo ""
                    echo "- \`$IMAGE:5-cn\`"
                    echo "- \`$IMAGE:${{ steps.ver.outputs.version }}-cn\`"
                    echo "- 体积: ${MB} MB（完整版约 1370 MB）"
                    echo "- Docker Hub（免登录）: \`docker.io/${DOCKERHUB_USERNAME}/ms-rewards-v5:5-cn\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    extra-images:
        name: Build panel & all-in-one images
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        if: ${{ needs.build.result == 'success' }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false

            - name: Read version
              id: ver
              run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

            - name: Read panel version
              id: pver
              run: |
                  v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' panel/server.py | head -1)
                  echo "version=${v:-0.0.0}" >> "$GITHUB_OUTPUT"

            - name: Skip when no Docker Hub token
              if: env.DOCKERHUB_TOKEN == ''
              run: echo "DOCKERHUB_TOKEN 未配置，跳过多镜像发布"

            - name: Login to Docker Hub
              if: env.DOCKERHUB_TOKEN != ''
              uses: docker/login-action@v3
              with:
                  registry: docker.io
                  username: ${{ env.DOCKERHUB_USERNAME }}
                  password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Build & push all-in-one image (runtime + panel)
              if: env.DOCKERHUB_TOKEN != ''
              run: |
                  set -e
                  DH="docker.io/${DOCKERHUB_USERNAME}/ms-rewards-v5"
                  docker build -f deploy/Dockerfile.all-in-one \
                    --build-arg BASE="${DH}:5-cn" \
                    -t "${DH}:5-cn-allinone" .
                  docker push "${DH}:5-cn-allinone"
                  echo "已推送 ${DH}:5-cn-allinone"

            - name: Build & push panel image
              if: env.DOCKERHUB_TOKEN != ''
              run: |
                  set -e
                  DP="docker.io/${DOCKERHUB_USERNAME}/ms-rewards-v5-panel"
                  docker build -f panel-image/Dockerfile \
                    -t "${DP}:latest" -t "${DP}:${{ steps.pver.outputs.version }}" .
                  docker push "${DP}:latest"
                  docker push "${DP}:${{ steps.pver.outputs.version }}"
                  echo "已推送 ${DP}:latest 与 :${{ steps.pver.outputs.version }}（面板版本）"
